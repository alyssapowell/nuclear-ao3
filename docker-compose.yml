version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    container_name: nuclear-ao3-postgres
    environment:
      POSTGRES_DB: ao3_nuclear
      POSTGRES_USER: ao3_user
      POSTGRES_PASSWORD: ao3_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # The schema is created by the app itself ("nuclear migrate", which also
      # runs at startup), not by Postgres's first-start scripts.
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres 
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ao3_user -d ao3_nuclear"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: nuclear-ao3-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - monitoring_data:/shared
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared/redis &&
        ln -sf /shared/redis /data &&
        redis-server /usr/local/etc/redis/redis.conf
      "
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The whole backend: accounts, works, tags, search, notifications, exports.
  # One program, one port. Only Caddy talks to it from outside.
  app:
    build:
      context: ./backend
    container_name: nuclear-ao3-app
    environment:
      - PORT=8080
      - METRICS_ADDR=:9091
      - DATABASE_URL=postgres://ao3_user:ao3_password@postgres:5432/ao3_nuclear?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_ISSUER=nuclear-ao3
      - SIGNING_KEY_FILE=${SIGNING_KEY_FILE:-}
      - SIGNING_KEY_PREVIOUS_FILES=${SIGNING_KEY_PREVIOUS_FILES:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - SMTP_HOST=smtp
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-noreply@nuclear-ao3.local}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Nuclear AO3}
      - SITE_URL=${SITE_URL:-http://localhost}
      - JOB_WORKERS=${JOB_WORKERS:-2}
    # The key files are readable only by their owner, so the app must run as
    # the user who owns ./secrets. Linux: set APP_UID in .env to `id -u`.
    user: "${APP_UID:-1001}"
    volumes:
      # Login signing keys (see "Set up the signing key" in docs/RUNBOOK.md).
      - ./secrets:/secrets:ro
    ports:
      # Published on localhost only, for `npm run dev` in frontend/. Caddy is
      # the public entrance.
      - "127.0.0.1:8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      smtp:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SMTP Server - Lightweight mail relay for sending emails
  # Development: MailHog (catches emails, web UI at http://localhost:8025)
  # Production-like: Use the same image but it will relay emails
  smtp:
    image: mailhog/mailhog:v1.0.1
    container_name: nuclear-ao3-smtp
    ports:
      - "127.0.0.1:1025:1025"  # SMTP server (services connect here)
      - "127.0.0.1:8025:8025"  # Web UI (development only - see all sent emails)
    restart: unless-stopped
    environment:
      - MH_SMTP_BIND_ADDR=0.0.0.0:1025
      - MH_UI_BIND_ADDR=0.0.0.0:8025
      - MH_API_BIND_ADDR=0.0.0.0:8025
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: nuclear-ao3-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - monitoring_data:/shared
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared/prometheus &&
        ln -sf /shared/prometheus /prometheus &&
        /bin/prometheus 
          --config.file=/etc/prometheus/prometheus.yml
          --storage.tsdb.path=/prometheus
          --web.console.libraries=/usr/share/prometheus/console_libraries
          --web.console.templates=/usr/share/prometheus/consoles
          --storage.tsdb.retention.time=30d
          --web.enable-lifecycle
      "

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: nuclear-ao3-grafana
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - monitoring_data:/shared
      - ./monitoring:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared/grafana &&
        ln -sf /shared/grafana /var/lib/grafana &&
        /run.sh
      "

  # Log aggregation - Loki
  loki:
    image: grafana/loki:latest
    container_name: nuclear-ao3-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - monitoring_data:/shared
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared/loki &&
        ln -sf /shared/loki /loki &&
        /usr/bin/loki -config.file=/etc/loki/local-config.yaml
      "

  # The front door: serves the website and forwards /api to the app.
  # Its image is built from frontend/ and contains the website's files.
  caddy:
    build:
      context: ./frontend
    image: nuclear-ao3/web
    container_name: nuclear-ao3-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - config_data:/shared
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared/caddy/logs &&
        ln -sf /shared/caddy/logs /var/log/caddy &&
        caddy run --config /etc/caddy/Caddyfile
      "
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - MONITORING_DOMAIN=${MONITORING_DOMAIN:-monitoring.localhost}
      - DEV_DOMAIN=${DEV_DOMAIN:-dev.localhost}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_HOST=app
      - APP_PORT=8080
      - GRAFANA_HOST=grafana
      - GRAFANA_PORT=3000
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # Large data volumes (separate for performance & backup isolation)
  postgres_data:      # 20-50GB - Database 
    driver: local
  backup_data:       # 50-100GB - Backups
    driver: local
  
  # Medium shared volume (monitoring + cache)
  monitoring_data:   # 20GB - Prometheus, Grafana, Loki, Redis
    driver: local
    
  # Small shared volume (configs + logs) 
  config_data:       # 10GB - Shared configs and logs
    driver: local
    
  # SSL certificate persistence
  caddy_data:        # 1GB - SSL certificates and Caddy data
    driver: local
  caddy_config:      # 1GB - Caddy configuration cache
    driver: local

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16