version: '3.8'

# Every service keeps at most 5 log files of 20 MB (about 100 MB each), so
# logs can't fill the disk, which would stop the database.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Database
  postgres:
    logging: *logging
    image: postgres:15.14
    container_name: nuclear-ao3-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ao3_nuclear}
      POSTGRES_USER: ${POSTGRES_USER:-ao3_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ao3_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # The schema is created by the app itself ("nuclear migrate", which also
      # runs at startup), not by Postgres's first-start scripts.
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres 
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The whole backend: accounts, works, tags, search, notifications, exports.
  # One program, one port. Only Caddy talks to it from outside.
  app:
    logging: *logging
    build:
      context: ./backend
    container_name: nuclear-ao3-app
    environment:
      - PORT=8080
      - METRICS_ADDR=:9091
      - DATABASE_URL=postgres://${POSTGRES_USER:-ao3_user}:${POSTGRES_PASSWORD:-ao3_password}@postgres:5432/${POSTGRES_DB:-ao3_nuclear}?sslmode=disable
      - JWT_ISSUER=nuclear-ao3
      - SIGNING_KEY_FILE=${SIGNING_KEY_FILE:-}
      - SIGNING_KEY_PREVIOUS_FILES=${SIGNING_KEY_PREVIOUS_FILES:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - SMTP_HOST=${SMTP_HOST:-smtp}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@nuclear-ao3.local}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Nuclear AO3}
      - SITE_URL=${SITE_URL:-http://localhost}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JOB_WORKERS=${JOB_WORKERS:-2}
    # The key files are readable only by their owner, so the app must run as
    # the user who owns ./secrets. Linux: set APP_UID in .env to `id -u`.
    user: "${APP_UID:-1001}"
    volumes:
      # Login signing keys (see "Set up the signing key" in docs/RUNBOOK.md).
      - ./secrets:/secrets:ro
    ports:
      # Published on localhost only, for `npm run dev` in frontend/. Caddy is
      # the public entrance.
      - "127.0.0.1:8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      smtp:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SMTP Server - Lightweight mail relay for sending emails
  # Development: MailHog (catches emails, web UI at http://localhost:8025)
  # Production-like: Use the same image but it will relay emails
  smtp:
    logging: *logging
    image: mailhog/mailhog:v1.0.1
    container_name: nuclear-ao3-smtp
    ports:
      - "127.0.0.1:1025:1025"  # SMTP server (services connect here)
      - "127.0.0.1:8025:8025"  # Web UI (development only - see all sent emails)
    restart: unless-stopped
    environment:
      - MH_SMTP_BIND_ADDR=0.0.0.0:1025
      - MH_UI_BIND_ADDR=0.0.0.0:8025
      - MH_API_BIND_ADDR=0.0.0.0:8025

  # Monitoring - Prometheus: collects numbers from the app and checks the alert
  # rules. See docs/MONITORING.md.
  prometheus:
    logging: *logging
    image: prom/prometheus:v3.5.0
    container_name: nuclear-ao3-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    depends_on:
      - app

  # Monitoring - reads the server's disk and memory, for the "disk almost
  # full" alert. Not published outside Docker.
  node-exporter:
    logging: *logging
    image: prom/node-exporter:v1.9.1
    container_name: nuclear-ao3-node-exporter
    volumes:
      - /:/host:ro
    command:
      - --path.rootfs=/host
    restart: unless-stopped

  # Monitoring - Grafana: dashboards. Everything it shows is set up from files
  # in ./monitoring/grafana, so there is nothing to click through on first run.
  grafana:
    logging: *logging
    image: grafana/grafana:12.0.0
    container_name: nuclear-ao3-grafana
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      # Compose refuses to start until GRAFANA_ADMIN_PASSWORD is set in .env.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Only used if you turn on email alerts (see docs/MONITORING.md).
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # The front door: serves the website and forwards /api to the app.
  # Its image is built from frontend/ and contains the website's files.
  caddy:
    logging: *logging
    build:
      context: ./frontend
    image: nuclear-ao3/web
    container_name: nuclear-ao3-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - config_data:/shared
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared/caddy/logs &&
        ln -sf /shared/caddy/logs /var/log/caddy &&
        caddy run --config /etc/caddy/Caddyfile
      "
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - DEV_DOMAIN=${DEV_DOMAIN:-dev.localhost}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_HOST=app
      - APP_PORT=8080
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # Large data volumes (separate for performance & backup isolation)
  postgres_data:      # 20-50GB - Database 
    driver: local
  backup_data:       # 50-100GB - Backups
    driver: local

  # Prometheus numbers (30 days) and Grafana's own database
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

  # Small shared volume (configs + logs) 
  config_data:       # 10GB - Shared configs and logs
    driver: local
    
  # SSL certificate persistence
  caddy_data:        # 1GB - SSL certificates and Caddy data
    driver: local
  caddy_config:      # 1GB - Caddy configuration cache
    driver: local

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16