apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus          # the dashboards refer to this exact uid
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      manageAlerts: true     # shows the alert rules from alerts.yml in Grafana's Alerting page
