# Prometheus collects numbers from the app every 15 seconds and checks the
# alert rules in alerts.yml. Edit nothing here for a normal install.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The Nuclear AO3 app: web traffic, background jobs and database numbers.
  # Port 9091 is private to the Docker network; it is not published.
  - job_name: app
    static_configs:
      - targets: ["app:9091"]

  # Prometheus watching itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The server's own disk (see node-exporter in docker-compose.yml).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
