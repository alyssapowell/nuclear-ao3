name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: 
          - staging
          - production
        default: staging
      git_ref:
        description: 'Git ref to deploy (branch, tag, or commit SHA)'
        required: true
        default: main

jobs:
  deploy:
    name: Deploy Nuclear AO3 to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          echo "Testing SSH connection to $USER@$HOST"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 $USER@$HOST 'echo "✅ SSH connection successful!"'

      - name: Deploy to Hetzner
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST 'bash -s' << EOF
            set -e
            
            # Set variables inside the SSH session
            export GIT_REF="${{ github.event.inputs.git_ref }}"
            export DEPLOY_ENV="${{ github.event.inputs.environment }}"
            export DOMAIN="${{ secrets.DOMAIN }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            
            echo "🚀 Starting Nuclear AO3 deployment to Hetzner..."
            echo "Environment: \$DEPLOY_ENV"
            echo "Git ref: \$GIT_REF"
            echo "Domain: \$DOMAIN"
            
            # Create deployment directory
            sudo mkdir -p /opt/nuclear-ao3
            sudo chown -R \$(whoami):\$(whoami) /opt/nuclear-ao3
            cd /opt/nuclear-ao3
            
            # Clone or update repository
            if [ -d ".git" ]; then
              echo "📥 Updating existing repository..."
              # Reset any local changes to avoid merge conflicts
              git reset --hard HEAD
              git clean -fd
              git fetch origin
              git checkout \$GIT_REF
              git reset --hard origin/\$GIT_REF
            else
              echo "📥 Cloning repository..."
              git clone https://github.com/alyssapowell/nuclear-ao3.git .
              git checkout \$GIT_REF
            fi
            
            # Create environment files
            echo "⚙️ Setting up environment files..."
            
            # Root .env file
            cp .env.example .env
            sed -i "s/ENVIRONMENT=development/ENVIRONMENT=\$DEPLOY_ENV/" .env
            sed -i "s/DOMAIN=localhost/DOMAIN=\$DOMAIN/" .env
            sed -i "s/JWT_SECRET=.*/JWT_SECRET=\$JWT_SECRET/" .env
            
            # Backend .env file
            cp backend/.env.example backend/.env
            sed -i "s/GO_ENV=development/GO_ENV=\$DEPLOY_ENV/" backend/.env
            sed -i "s/GIN_MODE=debug/GIN_MODE=release/" backend/.env
            sed -i "s/JWT_SECRET=.*/JWT_SECRET=\$JWT_SECRET/" backend/.env
            sed -i "s/POSTGRES_HOST=localhost/POSTGRES_HOST=postgres/" backend/.env
            sed -i "s/REDIS_HOST=localhost/REDIS_HOST=redis/" backend/.env
            sed -i "s/ELASTICSEARCH_HOST=localhost/ELASTICSEARCH_HOST=elasticsearch/" backend/.env
            sed -i "s/FRONTEND_URL=.*/FRONTEND_URL=https://\$DOMAIN/" backend/.env
            
            # Copy backend production config
            cp backend/.env backend/.env.production
            
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker \$(whoami)
              sudo systemctl enable docker
              sudo systemctl start docker
              # Re-login to apply docker group membership
              newgrp docker
            fi
            
            # Install Docker Compose if not present
            if ! command -v docker-compose &> /dev/null; then
              echo "🐳 Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            # Stop existing services
            echo "🛑 Stopping existing services..."
            docker-compose down || true
            
            # Remove old images for clean deployment
            echo "🧹 Cleaning up old images..."
            docker system prune -f || true
            
            # Build and start services
            echo "🏗️ Building and starting Nuclear AO3..."
            docker-compose build --parallel
            docker-compose up -d
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to be ready..."
            sleep 30
            
            # Health check
            echo "🔍 Checking service health..."
            max_attempts=12
            attempt=0
            
            while [ \$attempt -lt \$max_attempts ]; do
              if curl -f http://localhost:8088/health >/dev/null 2>&1; then
                echo "✅ API Gateway is healthy!"
                break
              else
                echo "⏳ Health check attempt \$((attempt + 1))/\$max_attempts..."
                sleep 10
                attempt=\$((attempt + 1))
              fi
            done
            
            if [ \$attempt -eq \$max_attempts ]; then
              echo "❌ Health checks failed"
              echo "🔍 Checking service logs..."
              docker-compose logs --tail 20
              exit 1
            fi
            
            # Show final status
            echo "📊 Final deployment status:"
            docker-compose ps
            
            echo "✅ Nuclear AO3 deployment to \$DEPLOY_ENV complete!"
            
            if [ "\$DEPLOY_ENV" = "production" ]; then
              echo "🌍 Production URL: https://\$DOMAIN"
            else
              echo "🧪 Staging URL: https://staging.\$DOMAIN"
            fi
          EOF

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 SUCCESS: Nuclear AO3 deployed to Hetzner!"
            echo "🌐 Environment: ${{ github.event.inputs.environment }}"
            echo "📦 Git ref: ${{ github.event.inputs.git_ref }}"
            echo "🏃‍♂️ Triggered by: ${{ github.actor }}"
          else
            echo "💥 FAILED: Nuclear AO3 deployment failed"
            echo "🔄 Please check the logs and try again"
            exit 1
          fi