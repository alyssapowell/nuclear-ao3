name: 🧪 CI - Test Pull Requests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nuclear-ao3

jobs:
  # Test Go backend services
  test-backend:
    name: 🧪 Test Backend Services
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ao3_nuclear_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Apply migrations to an empty database
        working-directory: backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ao3_nuclear_test?sslmode=disable"
        run: |
          go run ./cmd/nuclear migrate
          # A second run must find nothing to do.
          go run ./cmd/nuclear migrate status | grep -qx "up to date"
          # The demo data must still load against the current schema, and a
          # second load must find it there and add nothing.
          TRIAL_NO_EMAIL=true DEMO_PASSWORD=ci-demo-password go run ./cmd/nuclear demo-data
          again=$(TRIAL_NO_EMAIL=true DEMO_PASSWORD=ci-demo-password go run ./cmd/nuclear demo-data 2>&1)
          grep -q "already exist" <<< "$again"

      - name: Run linting (advisory, does not block)
        # Advisory until the lint backlog is cleared: a failure here shows as a
        # warning on the run, but does not fail the job. Remove this line once
        # "golangci-lint run ./..." passes, so lint failures block merges.
        continue-on-error: true
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: Run tests
        working-directory: backend
        env:
          # Every test makes its own fully migrated database on this server and
          # drops it afterwards (internal/testdb), so the user must be able to
          # CREATE DATABASE; the service's postgres superuser can.
          TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.out
          flags: backend
          # Coverage upload problems (such as a missing token) are reported but
          # do not fail the build; the tests above are what gate the merge.
          fail_ci_if_error: false

  # Test Frontend
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

  # Build the backend image
  test-docker-build:
    name: 🐳 Test Backend Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nuclear-ao3/app:test backend

  test-frontend-docker:
    name: 🐳 Test Frontend Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Frontend Docker build
        run: |
          echo "🐳 Testing Frontend Docker build..."
          docker build -t nuclear-ao3/frontend:test frontend/

      - name: Serve the site with the real Caddyfile
        run: |
          docker run -d --name test-web -p 3333:80 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile" \
            -e DOMAIN=:80 -e MONITORING_DOMAIN=:8081 \
            nuclear-ao3/frontend:test
          # Wait up to 30 seconds for the server to answer.
          deadline=$((SECONDS + 30))
          until curl -fsS -o /dev/null http://localhost:3333/; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "The web server did not start"
              docker logs test-web
              exit 1
            fi
            sleep 1
          done
          # The home page, and a deep link, must both return the app.
          curl -fsS http://localhost:3333/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3333/works/some-id | grep -q '<div id="root">'

      - name: Remove the test web server
        if: always()
        run: docker rm -f test-web

  # The whole Docker Compose stack, started for real and checked for real:
  # the app, the website through Caddy, monitoring, and the ops scripts.
  # Nothing in here ignores a failure. See docs/OPS_PIPELINES.md.
  end-to-end:
    name: End-to-end (Docker stack, monitoring, ops scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the ops scripts that need no Docker
        run: |
          bash scripts/ops/test-dispatch.sh
          bash scripts/ops/test-offsite.sh

      - name: Make "docker-compose" work (the Makefile uses that name)
        run: |
          # The Makefile calls "docker-compose"; GitHub's runners only have the
          # "docker compose" plugin. This forwards one to the other. Compose run
          # and exec get -T because CI has no terminal.
          docker compose version
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'SHIM'
          #!/usr/bin/env bash
          if [ "${1:-}" = run ] || [ "${1:-}" = exec ]; then
            sub=$1
            shift
            exec docker compose "$sub" -T "$@"
          fi
          exec docker compose "$@"
          SHIM
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Set up .env the way make dev-setup does (without npm)
        run: |
          cp .env.example .env
          # set_env NAME VALUE: drops any earlier NAME= line, then adds this one.
          set_env() {
            awk -F= -v k="$1" '$1 != k' .env > .env.tmp
            mv .env.tmp .env
            echo "$1=$2" >> .env
          }
          grafana_pw=$(openssl rand -hex 16)
          echo "::add-mask::$grafana_pw"
          set_env ENVIRONMENT development
          set_env GRAFANA_ADMIN_PASSWORD "$grafana_pw"
          set_env SITE_URL http://localhost
          # ":80" makes Caddy serve plain http. With DOMAIN=localhost it would
          # redirect every http request to https with a self-made certificate.
          set_env DOMAIN :80
          set_env APP_UID "$(id -u)"
          echo "GRAFANA_ADMIN_PASSWORD=$grafana_pw" >> "$GITHUB_ENV"
          # Say which settings are present, never their values.
          grep -o '^[A-Z_]*=' .env | sort -u | tr '\n' ' '
          echo

      - name: Create the signing key
        run: |
          make keys-setup
          grep -q '^SIGNING_KEY_FILE=/secrets/.' .env
          make keys-show | tee keys-show.out
          grep -Eq '^current: +[A-Za-z0-9_-]{8,}' keys-show.out
          rm keys-show.out

      - name: Start the whole stack
        run: docker compose up -d --build

      - name: Wait until every service answers
        run: |
          # wait_for NAME COMMAND...: runs COMMAND until it succeeds, for up to
          # 300 seconds in all. Fails the step when the time is up.
          deadline=$((SECONDS + 300))
          wait_for() {
            local name=$1
            shift
            until "$@" >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "TIMED OUT waiting for: $name"
                return 1
              fi
              sleep 3
            done
            echo "ready: $name"
          }
          container_healthy() {
            local id
            id=$(docker compose ps -q "$1")
            [ -n "$id" ] && [ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ]
          }
          wait_for "app /health on 127.0.0.1:8088" curl -fsS -m 5 http://127.0.0.1:8088/health
          wait_for "Caddy http://localhost/health" curl -fsS -m 5 http://localhost/health
          wait_for "Prometheus /-/ready" curl -fsS -m 5 http://127.0.0.1:9090/-/ready
          wait_for "Grafana /api/health" curl -fsS -m 5 http://127.0.0.1:3002/api/health
          wait_for "MailHog /api/v2/messages" curl -fsS -m 5 http://127.0.0.1:8025/api/v2/messages
          # The ops diagnose script reports a container that is still "starting".
          for svc in postgres app caddy; do
            wait_for "$svc container healthy" container_healthy "$svc"
          done

      - name: Smoke test the app directly (full)
        run: MAILHOG_URL=http://127.0.0.1:8025 bash scripts/smoke-test.sh http://127.0.0.1:8088

      - name: Smoke test through Caddy (read-only)
        run: SMOKE_READ_ONLY=1 MAILHOG_URL=http://127.0.0.1:8025 bash scripts/smoke-test.sh http://localhost

      - name: Check that monitoring is really set up
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, time, urllib.request

          def get(url, auth=None):
              req = urllib.request.Request(url)
              if auth:
                  token = base64.b64encode(auth.encode()).decode()
                  req.add_header("Authorization", "Basic " + token)
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)

          def fail(msg):
              print("FAIL  " + msg)
              sys.exit(1)

          def ok(msg):
              print("PASS  " + msg)

          # Poll FN until it returns a truthy value, for up to SECONDS.
          def wait_until(what, fn, seconds):
              end = time.time() + seconds
              last = None
              while True:
                  try:
                      last = fn()
                      if last:
                          return last
                  except Exception as e:
                      last = "error: %s" % e
                  if time.time() >= end:
                      fail("%s (last answer: %s)" % (what, last))
                  time.sleep(3)

          graf = "http://127.0.0.1:3002"
          prom = "http://127.0.0.1:9090"
          auth = "admin:" + os.environ["GRAFANA_ADMIN_PASSWORD"]

          # Grafana: the datasource and the dashboard come from files.
          ds = wait_until("Grafana datasource uid prometheus",
                          lambda: get(graf + "/api/datasources/uid/prometheus", auth), 30)
          if ds.get("uid") != "prometheus" or ds.get("type") != "prometheus":
              fail("datasource looks wrong: %r" % ds)
          ok("Grafana has the Prometheus datasource (uid prometheus)")

          found = wait_until("Grafana dashboard 'Archive overview'",
                             lambda: [d for d in get(graf + "/api/search?query=Archive", auth)
                                      if d.get("title") == "Archive overview"], 30)
          ok("Grafana has the dashboard 'Archive overview' (%s)" % found[0].get("uid"))

          # Prometheus: the app and node-exporter are scraped and healthy.
          def targets_up():
              active = get(prom + "/api/v1/targets")["data"]["activeTargets"]
              health = {}
              for t in active:
                  health[t["labels"]["job"]] = t["health"]
              return health if health.get("app") == "up" and health.get("node") == "up" else None
          health = wait_until("Prometheus targets app and node both up", targets_up, 60)
          ok("Prometheus targets are up: %s" % json.dumps(health, sort_keys=True))

          # Prometheus: every alert in monitoring/alerts.yml is loaded.
          wanted = set(re.findall(r"^\s*-\s*alert:\s*(\w+)", open("monitoring/alerts.yml").read(), re.M))
          if "AppDown" not in wanted:
              fail("monitoring/alerts.yml no longer defines AppDown")
          def rules_loaded():
              groups = get(prom + "/api/v1/rules")["data"]["groups"]
              have = {r["name"] for g in groups for r in g["rules"] if r.get("type") == "alerting"}
              return have if wanted <= have else None
          have = wait_until("Prometheus loaded the alert rules %s" % sorted(wanted), rules_loaded, 30)
          ok("Prometheus loaded all %d alert rules" % len(wanted))

          # The app's numbers arrive, and they arrive through Prometheus because
          # the metrics port is private to the Docker network.
          def requests_counted():
              res = get(prom + "/api/v1/query?query=http_requests_total")["data"]["result"]
              return res or None
          res = wait_until("http_requests_total has data in Prometheus", requests_counted, 60)
          ok("http_requests_total has %d series" % len(res))
          PY

      - name: Check the app's metrics port is not published
        run: |
          if published=$(docker compose port app 9091 2>/dev/null) && [ -n "$published" ]; then
            echo "FAIL  app metrics port 9091 is published at $published"
            exit 1
          fi
          if curl -sS -m 3 -o /dev/null http://127.0.0.1:9091/metrics 2>/dev/null; then
            echo "FAIL  127.0.0.1:9091 answers from the host"
            exit 1
          fi
          echo "PASS  metrics port 9091 is private to the Docker network"

      - name: Ops - back up the database
        run: |
          make ops-backup
          # Exactly one backup so far, and it must be a readable gzip file.
          count=$(ls -1 backups/nuclear-*.sql.gz | wc -l)
          test "$count" -eq 1
          for f in backups/nuclear-*.sql.gz; do
            test -s "$f"
            gunzip -t "$f"
            echo "PASS  $f is a valid gzip file"
          done

      - name: Ops - diagnose reports only the missing off-server backup
        run: |
          # Off-server backup is not configured in CI, so diagnose is expected
          # to exit 1 with exactly one problem and no other.
          rc=0
          make ops-diagnose > diagnose.out || rc=$?
          cat diagnose.out
          test "$rc" -eq 1
          grep -q '^## Result: PROBLEMS (1)$' diagnose.out
          grep -q 'Off-server backup is not set up' diagnose.out
          # And that one problem is the only bullet under the result heading.
          bullets=$(sed -n '/^## Result: PROBLEMS/,$p' diagnose.out | grep -c '^- ')
          test "$bullets" -eq 1
          echo "PASS  diagnose exited 1 with only the off-server backup problem"

      - name: Ops - restore a backup (full round trip)
        run: |
          B=http://127.0.0.1:8088/api/v1
          # psql_q SQL: runs one statement in the database and prints the result.
          psql_q() {
            docker compose exec -T postgres sh -c \
              'PGPASSWORD="$POSTGRES_PASSWORD" psql -At -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"' \
              sh "$1" </dev/null
          }

          # 1. Write a marker through the API: a new account.
          marker="ci-marker-$(openssl rand -hex 4)"
          pw="Marker-$(openssl rand -hex 8)-Pass1"
          body="{\"pen_name\":\"$marker\",\"email\":\"$marker@example.org\",\"password\":\"$pw\"}"
          curl -fsS -o /dev/null -X POST "$B/auth/register" -H 'Content-Type: application/json' -d "$body"
          test "$(psql_q "SELECT count(*) FROM users WHERE email = '$marker@example.org'")" = 1
          echo "marker account $marker is in the database"

          # 2. Back it up. Then wait, so the safety backup that restore takes
          #    gets a different file name from this one.
          before=$(ls -1 backups/nuclear-*.sql.gz)
          make ops-backup
          backup=$(comm -13 <(echo "$before") <(ls -1 backups/nuclear-*.sql.gz) | head -n 1)
          test -n "$backup"
          backup=$(basename "$backup")
          echo "backup with the marker: $backup"
          gunzip -t "backups/$backup"
          sleep 2

          # 3. Delete the marker.
          psql_q "DELETE FROM users WHERE email = '$marker@example.org'"
          test "$(psql_q "SELECT count(*) FROM users WHERE email = '$marker@example.org'")" = 0

          # 4. Restore. make asks for the phrase on standard input.
          printf 'replace the database\n' | make ops-restore FILE="$backup"

          # 5. The marker is back, and the app is healthy.
          test "$(psql_q "SELECT count(*) FROM users WHERE email = '$marker@example.org'")" = 1
          curl -fsS -m 10 http://127.0.0.1:8088/health
          echo
          echo "PASS  restore brought the marker account back"

      - name: Ops - list background jobs
        run: |
          make jobs | tee jobs.out
          grep -q 'KIND' jobs.out
          grep -q 'WAITING' jobs.out
          rm jobs.out

      - name: Show what happened (only when something failed)
        if: failure()
        # No "-e" here: keep printing even if one command fails.
        shell: bash {0}
        run: |
          echo "=== docker compose ps"
          docker compose ps -a
          for svc in $(docker compose config --services); do
            echo
            echo "=== last 200 log lines: $svc"
            docker compose logs --no-color --tail=200 "$svc"
          done
          echo
          echo "=== backups/ (names only)"
          ls -1 backups

      - name: Stop the stack and delete its data
        if: always()
        run: docker compose down -v

  # Security checks
  security:
    name: 🔒 Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Report-only on purpose: findings are uploaded to code scanning below
          # and do not fail this job (the action's default exit code is 0).
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # Summary check (required status check)
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-docker-build, test-frontend-docker, security, end-to-end]
    if: always()
    steps:
      - name: Check CI results
        run: |
          echo "📊 CI Results Summary:"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "Docker Builds: ${{ needs.test-docker-build.result }}"
          echo "Frontend Docker: ${{ needs.test-frontend-docker.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "End-to-end: ${{ needs.end-to-end.result }}"
          
          if [ "${{ needs.test-backend.result }}" = "success" ] && 
             [ "${{ needs.test-frontend.result }}" = "success" ] &&
             [ "${{ needs.test-docker-build.result }}" = "success" ] &&
             [ "${{ needs.test-frontend-docker.result }}" = "success" ] &&
             [ "${{ needs.security.result }}" = "success" ] &&
             [ "${{ needs.end-to-end.result }}" = "success" ]; then
            echo "✅ All CI checks passed!"
            echo "PR is ready for review and merge"
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi