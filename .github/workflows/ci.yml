name: 🧪 CI - Test Pull Requests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nuclear-ao3

jobs:
  # Test Go backend services
  test-backend:
    name: 🧪 Test Backend Services
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ao3_nuclear_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Apply migrations to an empty database
        working-directory: backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ao3_nuclear_test?sslmode=disable"
        run: |
          go run ./cmd/nuclear migrate
          # A second run must find nothing to do.
          go run ./cmd/nuclear migrate status | grep -qx "up to date"
          # The dev seed must still load against the current schema.
          PGPASSWORD=postgres psql -h localhost -U postgres -d ao3_nuclear_test -v ON_ERROR_STOP=1 -1 -f migrations/dev/seed.sql

      - name: Run linting
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./... || echo "⚠️ Linting completed with warnings"

      - name: Run tests
        working-directory: backend
        env:
          # Every test makes its own fully migrated database on this server and
          # drops it afterwards (internal/testdb), so the user must be able to
          # CREATE DATABASE; the service's postgres superuser can.
          TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.out
          flags: backend

  # Test Frontend
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test || echo "⚠️ Frontend tests completed"

  # Build the backend image
  test-docker-build:
    name: 🐳 Test Backend Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nuclear-ao3/app:test backend

  test-frontend-docker:
    name: 🐳 Test Frontend Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Frontend Docker build
        run: |
          echo "🐳 Testing Frontend Docker build..."
          docker build -t nuclear-ao3/frontend:test frontend/

      - name: Serve the site with the real Caddyfile
        run: |
          docker run -d --name test-web -p 3333:80 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile" \
            -e DOMAIN=:80 -e MONITORING_DOMAIN=:8081 \
            nuclear-ao3/frontend:test
          sleep 3
          # The home page, and a deep link, must both return the app.
          curl -fsS http://localhost:3333/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3333/works/some-id | grep -q '<div id="root">'
          docker logs test-web
          docker rm -f test-web

  # Test complete docker-compose stack
  test-docker-compose:
    name: 🐳 Test Docker Compose Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test environment file
        run: |
          cp .env.example .env
          echo "DOMAIN=localhost" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Test docker-compose build
        run: |
          echo "🐳 Testing docker-compose build..."
          docker-compose build --parallel

      - name: Test docker-compose startup
        run: |
          echo "🧪 Testing docker-compose startup..."
          # Start infrastructure services first
          docker-compose up -d postgres
          
          # Wait for databases to be ready
          echo "⏳ Waiting for databases..."
          sleep 30
          
          # Check database connectivity
          docker-compose exec -T postgres pg_isready -U ao3_user -d ao3_nuclear || echo "PostgreSQL startup in progress"
          
          # Start application services
          docker-compose up -d
          
          # Wait for all services
          sleep 60
          
          # Check service health
          echo "🔍 Checking service health..."
          docker-compose ps
          
          # Test API Gateway health (may fail, but good to try)
          curl -f http://localhost:8088/health || echo "App health check failed"

      - name: Show service logs
        if: always()
        run: |
          echo "📋 Service logs:"
          docker-compose logs --tail=20

      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v
          docker system prune -f

  # Security checks
  security:
    name: 🔒 Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # Integration test with real data
  integration-test:
    name: 🔗 Integration Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          cp .env.example .env
          echo "ENVIRONMENT=test" >> .env
          echo "DOMAIN=localhost" >> .env

      - name: Start services
        run: |
          echo "🚀 Starting Nuclear AO3 for integration testing..."
          docker-compose up -d
          
          # Wait for services to be ready
          echo "⏳ Waiting for services to start..."
          sleep 90

      - name: Wait for services to be healthy
        run: |
          echo "🔍 Waiting for services to be healthy..."
          timeout=300
          counter=0
          
          while [ $counter -lt $timeout ]; do
            if curl -f http://localhost:8080/health 2>/dev/null; then
              echo "✅ API Gateway is healthy!"
              break
            fi
            
            if [ $counter -eq 0 ]; then
              echo -n "Waiting for API Gateway"
            fi
            echo -n "."
            sleep 5
            counter=$((counter + 5))
          done
          
          if [ $counter -ge $timeout ]; then
            echo "❌ Services failed to become healthy"
            docker-compose logs
            exit 1
          fi

      - name: Run API integration tests
        run: |
          echo "🧪 Running API integration tests..."
          
          # Test health endpoints
          curl -f http://localhost:8080/health || exit 1
          
          # Test individual service health
          curl -f http://localhost:8081/health || echo "Auth service health check failed"
          curl -f http://localhost:8082/health || echo "Work service health check failed"
          curl -f http://localhost:8083/health || echo "Tag service health check failed"
          curl -f http://localhost:8084/health || echo "Search service health check failed"
          
          # Test the website (served by Caddy)
          curl -fk https://localhost/ || echo "Website check failed"
          
          echo "✅ Basic integration tests passed"

      - name: Test database connectivity
        run: |
          echo "🗄️ Testing database connectivity..."
          
          # Test PostgreSQL
          docker-compose exec -T postgres psql -U ao3_user -d ao3_nuclear -c "SELECT version();" || echo "PostgreSQL test failed"
          

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up integration test..."
          docker-compose down -v
          docker system prune -f

  # Summary check (required status check)
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-docker-build, test-frontend-docker, test-docker-compose, security, integration-test]
    if: always()
    steps:
      - name: Check CI results
        run: |
          echo "📊 CI Results Summary:"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "Docker Builds: ${{ needs.test-docker-build.result }}"
          echo "Frontend Docker: ${{ needs.test-frontend-docker.result }}"
          echo "Docker Compose: ${{ needs.test-docker-compose.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Integration: ${{ needs.integration-test.result }}"
          
          if [ "${{ needs.test-backend.result }}" = "success" ] && 
             [ "${{ needs.test-frontend.result }}" = "success" ] &&
             [ "${{ needs.test-docker-build.result }}" = "success" ] &&
             [ "${{ needs.test-frontend-docker.result }}" = "success" ] &&
             [ "${{ needs.test-docker-compose.result }}" = "success" ] &&
             [ "${{ needs.security.result }}" = "success" ] &&
             [ "${{ needs.integration-test.result }}" = "success" ]; then
            echo "✅ All CI checks passed!"
            echo "PR is ready for review and merge"
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi